plugins {
    id 'java'
    id 'application'
}

group = 'com.krista.kme'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // LangChain4j Core
    implementation 'dev.langchain4j:langchain4j:0.35.0'

    // LLM Provider Integrations
    implementation 'dev.langchain4j:langchain4j-open-ai:0.35.0'        // OpenAI (GPT-4, GPT-3.5, etc.)
    implementation 'dev.langchain4j:langchain4j-anthropic:0.35.0'      // Claude (Anthropic)
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:0.35.0' // Google Gemini
    implementation 'dev.langchain4j:langchain4j-azure-open-ai:0.35.0'  // Azure OpenAI

    // Embeddings (for RAG)
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:0.35.0'

    // JSON Processing (for structured output)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.0'

    // Spring Boot for Web UI
    implementation 'org.springframework.boot:spring-boot-starter-web:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:3.2.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Apache POI for Excel generation
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

test {
    useJUnitPlatform()
}

// Default application to run
application {
    mainClass = 'com.krista.kme.agent.MinimalAgent'
}

// Task to run MinimalAgent
task runMinimal(type: JavaExec) {
    group = 'application'
    description = 'Run the Minimal Agent'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.MinimalAgent'
}

// Task to run AgentWithTools
task runTools(type: JavaExec) {
    group = 'application'
    description = 'Run the Agent with Tools'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.AgentWithTools'
}

// Task to run RAGAgent
task runRAG(type: JavaExec) {
    group = 'application'
    description = 'Run the RAG Agent'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.RAGAgent'
}

// Task to run PlannerAgent Example
task runPlannerExample(type: JavaExec) {
    group = 'application'
    description = 'Run the Planner Agent Example (simple demo)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.planner.PlannerAgentExample'
}

// Task to run PlannerAgent Interactive Demo
task runPlannerDemo(type: JavaExec) {
    group = 'application'
    description = 'Run the Planner Agent Interactive Demo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.planner.PlannerAgentDemo'
    standardInput = System.in  // Enable interactive input
}

// Task to run PlannerAgent Web UI
task runPlannerWeb(type: JavaExec) {
    group = 'application'
    description = 'Run the Planner Agent Web UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.krista.kme.agent.planner.web.PlannerWebApplication'
}

// Create fat JAR
jar {
    manifest {
        attributes 'Main-Class': 'com.krista.kme.agent.MinimalAgent'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

